name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The agent harness in harness/ ships in the package, with the docs built
      # as plain Markdown at pack time. Build them (a broken page or link
      # fails), then check the harness: its schema, its paths, and that every
      # file it names ships and every relative link points at a file.
      - name: Build the agent docs and check the harness
        run: pnpm check:harness

      # The docs' live examples resolve themes from src/ at build time, so a
      # library change can break the site. Build it and run Cookbook's
      # built-output checks.
      - name: Docs site
        run: pnpm build:docs && pnpm exec cookbook check-build
